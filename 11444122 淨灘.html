        function renderMap() {
            lineGroup.clearLayers();
            lineLayersStore = {};

            taoyuanRoutes.forEach(route => {
                const pathCoords = routePathsMap[route.id];
                if (!pathCoords) return;

                // 核心改動：依行政區設定專屬色系
                const routeColor = zoneColors[route.zone] || '#0284c7';

                const visualLine = L.polyline(pathCoords, {
                    color: routeColor,
                    weight: 5.5,
                    opacity: 0.85,
                    lineCap: 'round',
                    lineJoin: 'round'
                });

                const invisibleHotspot = L.polyline(pathCoords, {
                    color: routeColor,
                    weight: 32,
                    opacity: 0,
                    lineCap: 'round',
                    lineJoin: 'round',
                    className: 'invisible-hotspot'
                });

                const triggerSelect = () => {
                    // 還原所有線段的基本粗細與顏色
                    Object.keys(lineLayersStore).forEach(id => {
                        const r = taoyuanRoutes.find(x => x.id == id);
                        lineLayersStore[id].visual.setStyle({ weight: 5.5, opacity: 0.85, color: zoneColors[r.zone] });
                    });
                    // 強調被選中的路段
                    visualLine.setStyle({ weight: 10, opacity: 1 });
                    updateSidebarDetails(route);
                };

                invisibleHotspot.on('mouseover', () => { visualLine.setStyle({ weight: 8.5, opacity: 1 }); });
                invisibleHotspot.on('mouseout', () => {
                    if (document.getElementById('info-title').innerText !== route.title) {
                        visualLine.setStyle({ weight: 5.5, opacity: 0.85 });
                    }
                });

                invisibleHotspot.on('click', triggerSelect);
                visualLine.on('click', triggerSelect);

                lineGroup.addLayer(visualLine);
                lineGroup.addLayer(invisibleHotspot);

                lineLayersStore[route.id] = { visual: visualLine, hotspot: invisibleHotspot, zone: route.zone };
            });
        }

    `
     }
};   
  


   function showPage(pageId) {
    const pageContainer = document.getElementById('content-page');
    const pageBody = document.getElementById('page-body');

    pageContainer.classList.remove('hidden');

    pageBody.innerHTML = `
        <h1 class="text-3xl font-bold mb-6">${pages[pageId].title}</h1>
        ${pages[pageId].content}
    `;
}
function closePage() {
    document.getElementById('map').style.display = 'block';
    document.getElementById('sidebar').style.display = 'flex';
    document.getElementById('content-page').classList.add('hidden');
    
    if (typeof map !== 'undefined') {
        map.invalidateSize();
    }
}

   </script>
